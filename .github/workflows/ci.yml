name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly rebuild picks up Debian security updates in the base image.
    - cron: "20 11 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/mithr4ndir/hobby-bot

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.7"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest -q -rs

      # requirements.lock is what the Dockerfile installs. Fail if it drifted
      # from uv.lock so the image can never ship a different dependency set
      # than the one the tests ran against.
      - name: Lockfile export is current
        run: |
          uv export --frozen --no-dev --format requirements.txt -o /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock

  build:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read semver from pyproject
        id: ver
        run: |
          SEMVER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject version is not plain semver" >&2
            exit 1
          fi
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once into the local daemon so the scan sees the image before
      # anything is pushed.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: hobby-bot:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: hobby-bot:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the image that was scanned, not a rebuild: a cache miss on a second
      # build could produce different, unscanned layers.
      - name: Push scanned image
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
          SHA: ${{ github.sha }}
        run: |
          for tag in "$SEMVER" "sha-$SHA" latest; do
            docker tag hobby-bot:scan "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SEMVER")
          echo "$DIGEST"
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
