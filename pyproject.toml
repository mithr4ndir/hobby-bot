[project]
name = "hobby-bot"
version = "0.2.2"
description = "Discord bot that posts SF and Bay Area social hobby picks, three at a time, with no-repeat memory and stale-listing tracking. Runs on Kubernetes."
readme = "README.md"
requires-python = ">=3.12"
# Keep this list short: every dependency is attack surface in a process that
# holds a bot token. discord.py is the gateway client, dotenv is local-dev only.
dependencies = [
    "discord.py==2.5.2",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.14.0",
]

[tool.uv]
# Not built or installed: the image copies the modules and runs `python bot.py`.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
